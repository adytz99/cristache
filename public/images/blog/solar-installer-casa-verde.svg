<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Solar installer Casa Verde 2026 AI automation case study">
  <defs>
    <linearGradient id="svBg" x1="0" y1="0" x2="1" y2="1">
