      <text x="16" y="28" font-family="'Segoe UI', sans-serif" font-size="13" fill="#04140c">Da  2 buc. în depozit.</text>
      <text x="16" y="50" font-family="'Segoe UI', sans-serif" font-size="13" fill="#04140c">Confirm COD? Link 1 tap “</text>
