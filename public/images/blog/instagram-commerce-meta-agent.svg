    <text x="24" y="40" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#25d366">¬0 token</text>
    <text x="24" y="66" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8fafa0">Meta Agent bill</text>
  </g>

