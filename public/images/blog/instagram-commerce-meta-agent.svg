    <rect x="-150" y="-270" width="300" height="540" rx="40" fill="url(#mcPhone)"/>
    <rect x="-150" y="-270" width="300" height="540" rx="40" fill="none" stroke="#1a3328" stroke-width="2"/>

    <g transform="translate(0,-238)">
