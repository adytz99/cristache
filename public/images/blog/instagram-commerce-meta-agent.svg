    <radialGradient id="mcGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e1306c" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#e1306c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mcPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1218"/>
      <stop offset="100%" stop-color="#04080c"/>
    </linearGradient>
    <linearGradient id="mcRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f77737"/>
      <stop offset="35%" stop-color="#e1306c"/>
      <stop offset="70%" stop-color="#833ab4"/>
      <stop offset="100%" stop-color="#25d366"/>
    </linearGradient>
    <linearGradient id="mcBubbleIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#122018"/>
      <stop offset="100%" stop-color="#1a2e22"/>
