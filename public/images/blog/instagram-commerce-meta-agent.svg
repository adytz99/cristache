  <text x="88" y="302" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" fill="#f4f7f5">starts Aug 1.</text>
  <text x="88" y="364" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" fill="#25d366">They kept control.</text>
