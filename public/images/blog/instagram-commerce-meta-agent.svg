<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Instagram commerce Meta Business Agent cost cliff AI automation case study">
  <defs>
    <linearGradient id="mcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0c1420"/>
      <stop offset="100%" stop-color="#061018"/>
