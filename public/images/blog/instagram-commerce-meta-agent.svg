      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#7dd3a0">COD score · LOW RISK</text>
      <text x="16" y="44" font-family="'Segoe UI', sans-serif" font-size="12" fill="#f4f7f5">AWB + e-Factura queued</text>
    </g>

    <g transform="translate(-90,140)">
      <rect width="180" height="36" rx="12" fill="#122018" stroke="#1f3d2e" stroke-width="1"/>
      <text x="20" y="23" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8fafa0">Human refund gate · ON</text>
