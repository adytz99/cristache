<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Car repair shop automation case study">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0603"/>
      <stop offset="60%" stop-color="#1a0e05"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>
    <radialGradient id="cGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffa200" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#ffa200" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cGear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>
    <linearGradient id="cLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#ffa200"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <pattern id="cGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffa200" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="cBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#cBg)"/>
  <rect width="1600" height="900" fill="url(#cGrid)"/>
  <circle cx="1150" cy="450" r="480" fill="url(#cGlow)"/>

  <g transform="translate(1150,450)">
    <g opacity="0.35" filter="url(#cBlur)">
      <g fill="url(#cGear)">
        <path d="M -20,-240 L 20,-240 L 30,-200 L 60,-195 L 85,-225 L 120,-205 L 110,-165 L 140,-145 L 180,-160 L 195,-120 L 165,-95 L 170,-60 L 210,-40 L 205,0 L 170,10 L 165,45 L 195,75 L 180,115 L 140,100 L 110,120 L 120,160 L 85,180 L 60,150 L 30,155 L 20,195 L -20,195 L -30,155 L -60,150 L -85,180 L -120,160 L -110,120 L -140,100 L -180,115 L -195,75 L -165,45 L -170,10 L -205,0 L -210,-40 L -170,-60 L -165,-95 L -195,-120 L -180,-160 L -140,-145 L -110,-165 L -120,-205 L -85,-225 L -60,-195 L -30,-200 Z"/>
      </g>
      <circle r="90" fill="#03060a"/>
    </g>
    <g fill="none" stroke="#ffd166" stroke-width="2" opacity="0.8">
      <circle r="220"/>
      <circle r="140"/>
      <circle r="60"/>
    </g>
    <g stroke="#ffa200" stroke-width="2" fill="none" opacity="0.55">
      <path d="M -220,0 L -260,0 M 220,0 L 260,0 M 0,-220 L 0,-260 M 0,220 L 0,260"/>
    </g>
  </g>

  <g transform="translate(1020,620)" opacity="0.65">
    <path d="M 0,60 Q 40,10 90,10 L 270,10 Q 310,10 320,40 L 340,60 L 20,60 Z" fill="none" stroke="#ffa200" stroke-width="2"/>
    <circle cx="80" cy="60" r="18" fill="#03060a" stroke="#ffa200" stroke-width="2"/>
    <circle cx="260" cy="60" r="18" fill="#03060a" stroke="#ffa200" stroke-width="2"/>
  </g>

  <g transform="translate(110,200)" font-family="'Orbitron', 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="18" fill="#ffa200" letter-spacing="6">CASE STUDY // 02</text>
    <text x="0" y="70" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="2">AUTO REPAIR SHOP</text>
    <text x="0" y="120" font-size="32" fill="#ffd166" letter-spacing="3">AUTOMATION</text>

    <g transform="translate(0,180)">
      <rect x="0" y="0" width="220" height="90" rx="6" fill="none" stroke="#ffa200" stroke-width="2"/>
      <text x="20" y="38" font-size="16" fill="#ffd166" letter-spacing="3">RETURN RATE</text>
      <text x="20" y="78" font-size="48" font-weight="800" fill="#ffa200">2x</text>
    </g>

    <g transform="translate(240,180)">
      <rect x="0" y="0" width="240" height="90" rx="6" fill="none" stroke="#00f0ff" stroke-width="2"/>
      <text x="20" y="38" font-size="16" fill="#7ff7ff" letter-spacing="3">TICKET VALUE</text>
      <text x="20" y="78" font-size="44" font-weight="800" fill="#00f0ff">+41%</text>
    </g>

    <g transform="translate(0,310)" font-size="14" fill="#9aa3b2" letter-spacing="2">
      <text>AIRTABLE · TWILIO SMS · N8N · GOOGLE BUSINESS</text>
    </g>
  </g>

  <rect x="0" y="870" width="1600" height="2" fill="url(#cLine)"/>
</svg>
