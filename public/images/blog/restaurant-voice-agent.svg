<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Restaurant AI voice agent automation case study">
  <defs>
    <linearGradient id="vBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02060a"/>
      <stop offset="55%" stop-color="#04141a"/>
      <stop offset="100%" stop-color="#02080d"/>
    </linearGradient>
    <radialGradient id="vGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff8a" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#39ff8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vMic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaffd4"/>
      <stop offset="100%" stop-color="#0c8a52"/>
    </linearGradient>
    <linearGradient id="vLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#39ff8a"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <pattern id="vGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#39ff8a" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="vBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#vBg)"/>
  <rect width="1600" height="900" fill="url(#vGrid)"/>
  <circle cx="1150" cy="450" r="500" fill="url(#vGlow)"/>
  <circle cx="1150" cy="450" r="350" fill="url(#vGlow2)"/>

  <g transform="translate(1150,450)" opacity="0.55" stroke-width="2" fill="none">
    <circle r="120" stroke="#39ff8a" opacity="0.9"/>
    <circle r="180" stroke="#39ff8a" opacity="0.6"/>
    <circle r="240" stroke="#00f0ff" opacity="0.45"/>
    <circle r="310" stroke="#00f0ff" opacity="0.3"/>
    <circle r="380" stroke="#39ff8a" opacity="0.18"/>
  </g>

  <g transform="translate(1150,450)">
    <g filter="url(#vBlur)" opacity="0.6">
      <rect x="-40" y="-110" width="80" height="160" rx="40" fill="url(#vMic)"/>
    </g>
    <rect x="-40" y="-110" width="80" height="160" rx="40" fill="url(#vMic)" opacity="0.95"/>
    <rect x="-40" y="-110" width="80" height="160" rx="40" fill="none" stroke="#aaffd4" stroke-width="2"/>
    <path d="M -70 30 Q -70 90 0 90 Q 70 90 70 30" fill="none" stroke="#aaffd4" stroke-width="3"/>
    <line x1="0" y1="90" x2="0" y2="135" stroke="#aaffd4" stroke-width="3"/>
    <line x1="-25" y1="135" x2="25" y2="135" stroke="#aaffd4" stroke-width="3"/>

    <g stroke="#39ff8a" stroke-width="2" fill="none" opacity="0.85">
      <path d="M -180 -10 Q -150 -40 -120 -10 Q -90 20 -120 50"/>
      <path d="M -220 -30 Q -180 -80 -140 -30 Q -100 20 -140 70"/>
      <path d="M 180 -10 Q 150 -40 120 -10 Q 90 20 120 50"/>
      <path d="M 220 -30 Q 180 -80 140 -30 Q 100 20 140 70"/>
    </g>
  </g>

  <g transform="translate(1000,710)" opacity="0.7">
    <polyline
      points="0,40 30,40 40,20 50,55 60,5 70,60 80,15 90,50 100,40 130,40 140,28 150,45 160,25 170,55 180,18 190,52 200,40 240,40 250,30 260,48 270,22 280,50 290,15 300,55 310,40 350,40"
      fill="none" stroke="#39ff8a" stroke-width="2"/>
    <polyline
      points="350,40 370,40 380,28 390,52 400,18 410,55 420,22 430,50 440,30 470,40 480,15 490,60 500,25 510,48 520,18 530,55 540,28 550,45 560,40 600,40"
      fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.7"/>
  </g>

  <g transform="translate(110,200)" font-family="'Orbitron', 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="18" fill="#39ff8a" letter-spacing="6">CASE STUDY // 04</text>
    <text x="0" y="70" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="2">RESTAURANT</text>
    <text x="0" y="120" font-size="32" fill="#aaffd4" letter-spacing="3">VOICE AI AGENT</text>

    <g transform="translate(0,180)">
      <rect x="0" y="0" width="260" height="90" rx="6" fill="none" stroke="#39ff8a" stroke-width="2"/>
      <text x="20" y="38" font-size="16" fill="#aaffd4" letter-spacing="3">RESERVATIONS / MO</text>
      <text x="20" y="78" font-size="42" font-weight="800" fill="#39ff8a">+1,420</text>
    </g>

    <g transform="translate(280,180)">
      <rect x="0" y="0" width="240" height="90" rx="6" fill="none" stroke="#00f0ff" stroke-width="2"/>
      <text x="20" y="38" font-size="16" fill="#7ff7ff" letter-spacing="3">AI RESOLUTION</text>
      <text x="20" y="78" font-size="44" font-weight="800" fill="#00f0ff">92%</text>
    </g>

    <g transform="translate(0,310)" font-size="14" fill="#9aa3b2" letter-spacing="2">
      <text>VAPI · ELEVENLABS · OPENAI REALTIME · TWILIO · POS</text>
    </g>
  </g>

  <rect x="0" y="870" width="1600" height="2" fill="url(#vLine)"/>
</svg>
