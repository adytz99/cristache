    <text x="0" y="170" font-family="'Segoe UI', sans-serif" font-size="20" fill="#94a3b8">Instagram + WhatsApp AI that books</text>
    <text x="0" y="200" font-family="'Segoe UI', sans-serif" font-size="20" fill="#94a3b8">site visits before the competitor replies</text>
