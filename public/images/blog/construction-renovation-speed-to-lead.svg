      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="13" fill="#1a1004" font-weight="600">Programat. Trimis pe</text>
      <text x="16" y="44" font-family="'Segoe UI', sans-serif" font-size="13" fill="#1a1004">WhatsApp + checklist dosar.</text>
    </g>

