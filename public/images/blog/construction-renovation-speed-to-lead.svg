    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="18" fill="#fbbf24" letter-spacing="3">CASE STUDY</text>
    <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Speed-to-lead</text>
