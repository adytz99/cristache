    <rect x="320" y="0" width="160" height="56" rx="12" fill="#111827" stroke="#f97316" stroke-opacity="0.45" stroke-width="2"/>
    <text x="400" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#fdba74" font-weight="700">¬2.8M</text>
    <text x="400" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">pipeline / quarter</text>
