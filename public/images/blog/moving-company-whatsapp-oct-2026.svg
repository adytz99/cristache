      <text x="60" y="374" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Camere · etaj · lift · volum</text>
      <text x="60" y="400" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Poze incarcate: 6</text>
