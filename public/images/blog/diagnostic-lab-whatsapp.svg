<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Diagnostic lab WhatsApp results AI automation case study">
  <defs>
    <linearGradient id="labBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020b12"/>
      <stop offset="50%" stop-color="#041820"/>
      <stop offset="100%" stop-color="#03100e"/>
    </linearGradient>
    <radialGradient id="labGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3a6" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#22d3a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="labGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="labTube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f7ff"/>
      <stop offset="55%" stop-color="#22d3a6"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="labPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f24"/>
      <stop offset="100%" stop-color="#041014"/>
    </linearGradient>
    <linearGradient id="labLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#22d3a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="labBubble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0ea5a4"/>
    </linearGradient>
    <pattern id="labGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#22d3a6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="labBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#labBg)"/>
  <rect width="1600" height="900" fill="url(#labGrid)"/>
  <circle cx="1180" cy="430" r="480" fill="url(#labGlow1)"/>
  <circle cx="420" cy="620" r="320" fill="url(#labGlow2)"/>

  <!-- Left copy block -->
  <g transform="translate(120,210)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="28" fill="#7dd3c0" letter-spacing="4">CASE STUDY</text>
    <text x="0" y="70" font-family="'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#ecfeff">Diagnostic lab</text>
    <text x="0" y="135" font-family="'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#ecfeff">AI results agent</text>
    <rect x="0" y="170" width="420" height="3" fill="url(#labLine)"/>
    <text x="0" y="230" font-family="'Segoe UI', sans-serif" font-size="24" fill="#9fd9d0">WhatsApp · booking · prep · results</text>
    <text x="0" y="275" font-family="'Segoe UI', sans-serif" font-size="24" fill="#9fd9d0">78% are my results ready? calls</text>
    <text x="0" y="340" font-family="'Segoe UI', sans-serif" font-size="18" fill="#67e8c8">Ready for Meta Oct 2026 service fees</text>
  </g>

  <!-- Phone mock -->
  <g transform="translate(1080,160)">
    <g filter="url(#labBlur)" opacity="0.45">
      <rect x="10" y="20" width="300" height="560" rx="42" fill="#22d3a6" opacity="0.25"/>
    </g>
    <rect x="0" y="0" width="320" height="600" rx="44" fill="#0b2a30" stroke="#22d3a6" stroke-width="3"/>
    <rect x="14" y="18" width="292" height="564" rx="34" fill="url(#labPhone)"/>
    <rect x="120" y="28" width="80" height="10" rx="5" fill="#134e4a"/>

    <text x="36" y="78" font-family="'Segoe UI', sans-serif" font-size="16" fill="#99f6e4">Laborator · WhatsApp</text>
    <circle cx="270" cy="72" r="5" fill="#4ade80"/>

    <rect x="36" y="110" width="210" height="54" rx="18" fill="#12363c"/>
    <text x="52" y="143" font-family="'Segoe UI', sans-serif" font-size="15" fill="#cffafe">Sunt gata rezultatele?</text>

    <rect x="70" y="184" width="220" height="78" rx="18" fill="url(#labBubble)"/>
    <text x="86" y="216" font-family="'Segoe UI', sans-serif" font-size="14" fill="#ecfeff">Da  hemoleucograma e gata.</text>
    <text x="86" y="240" font-family="'Segoe UI', sans-serif" font-size="14" fill="#ecfeff">Link securizat · 24h</text>

    <rect x="36" y="286" width="200" height="48" rx="18" fill="#12363c"/>
    <text x="52" y="316" font-family="'Segoe UI', sans-serif" font-size="14" fill="#cffafe">Pot programa mâine?</text>

    <rect x="70" y="354" width="220" height="78" rx="18" fill="url(#labBubble)"/>
    <text x="86" y="386" font-family="'Segoe UI', sans-serif" font-size="14" fill="#ecfeff">Slot 08:20 · Floreasca</text>
    <text x="86" y="410" font-family="'Segoe UI', sans-serif" font-size="14" fill="#ecfeff">Pregtire: post 812h</text>

    <rect x="90" y="470" width="140" height="44" rx="22" fill="#134e4a" stroke="#22d3a6" stroke-width="1.5"/>
    <text x="118" y="498" font-family="'Segoe UI', sans-serif" font-size="15" fill="#99f6e4">Confirm</text>
  </g>

  <!-- Test tubes decoration -->
  <g transform="translate(780,520)" opacity="0.9">
    <rect x="0" y="40" width="36" height="140" rx="10" fill="none" stroke="#67e8f9" stroke-width="3"/>
    <rect x="4" y="100" width="28" height="76" rx="6" fill="url(#labTube)" opacity="0.85"/>
    <rect x="52" y="10" width="36" height="170" rx="10" fill="none" stroke="#22d3a6" stroke-width="3"/>
    <rect x="56" y="70" width="28" height="106" rx="6" fill="#38bdf8" opacity="0.75"/>
    <rect x="104" y="55" width="36" height="125" rx="10" fill="none" stroke="#99f6e4" stroke-width="3"/>
    <rect x="108" y="120" width="28" height="56" rx="6" fill="#14b8a6" opacity="0.8"/>
  </g>
</svg>
