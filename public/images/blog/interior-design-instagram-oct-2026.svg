<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Interior design studio Instagram WhatsApp AI automation case study  Meta October 2026">
  <defs>
    <linearGradient id="idBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0806"/>
      <stop offset="45%" stop-color="#1a120c"/>
      <stop offset="100%" stop-color="#060504"/>
    </linearGradient>
    <radialGradient id="idWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="idCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="idPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1410"/>
      <stop offset="100%" stop-color="#0a0705"/>
    </linearGradient>
    <linearGradient id="idRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c9a0"/>
      <stop offset="50%" stop-color="#c4784a"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="idBubbleIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1e16"/>
      <stop offset="100%" stop-color="#3a2a1e"/>
    </linearGradient>
    <linearGradient id="idBubbleAi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4784a"/>
      <stop offset="100%" stop-color="#a85a32"/>
    </linearGradient>
    <linearGradient id="idBefore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3530"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
    <linearGradient id="idAfter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d5b8"/>
      <stop offset="100%" stop-color="#c4a882"/>
    </linearGradient>
    <linearGradient id="idLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#c4784a"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="idGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#c4784a" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="idBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#idBg)"/>
  <rect width="1600" height="900" fill="url(#idGrid)"/>
  <circle cx="1180" cy="420" r="480" fill="url(#idWarm)"/>
  <circle cx="420" cy="640" r="360" fill="url(#idCyan)"/>

  <!-- Floor-plan frame -->
  <g transform="translate(120,160)" opacity="0.9">
    <rect x="0" y="0" width="520" height="380" rx="18" fill="#120e0a" stroke="url(#idRing)" stroke-width="2"/>
    <text x="28" y="42" fill="#e8c9a0" font-family="system-ui,sans-serif" font-size="18" font-weight="600">Project intake · Flows</text>
    <text x="28" y="68" fill="#8a7a6a" font-family="system-ui,sans-serif" font-size="13">kitchen · 18 m² · Bucharest · Oct 2026</text>
    <!-- simplified floor plan -->
    <g transform="translate(40,100)" stroke="#c4784a" stroke-width="2.5" fill="none" opacity="0.85">
      <rect x="0" y="0" width="280" height="200" rx="4"/>
      <line x1="140" y1="0" x2="140" y2="120"/>
      <line x1="0" y1="120" x2="140" y2="120"/>
      <rect x="180" y="40" width="60" height="80" rx="2" stroke="#22d3ee" stroke-dasharray="6 4"/>
      <circle cx="70" cy="60" r="18" stroke="#e8c9a0"/>
      <rect x="200" y="150" width="50" height="30" rx="2"/>
    </g>
    <g transform="translate(360,120)">
      <rect width="120" height="36" rx="8" fill="#1a2824" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="60" y="23" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="12" font-weight="600">range only</text>
      <rect y="52" width="120" height="36" rx="8" fill="#2a1a12" stroke="#c4784a" stroke-width="1.5"/>
      <text x="60" y="75" text-anchor="middle" fill="#e8c9a0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">human quote</text>
      <rect y="104" width="120" height="36" rx="8" fill="#121820" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="60" y="127" text-anchor="middle" fill="#a8e6f0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">site visit</text>
    </g>
    <line x1="28" y1="340" x2="492" y2="340" stroke="url(#idLine)" stroke-width="2"/>
    <text x="28" y="368" fill="#8a7a6a" font-family="system-ui,sans-serif" font-size="12">68% free-form WhatsApp replies · ready for 1 Oct Meta cliff</text>
  </g>

  <!-- Before / After reel card -->
  <g transform="translate(680,140)">
    <rect width="280" height="420" rx="24" fill="#100c08" stroke="#3a2e24" stroke-width="2"/>
    <rect x="16" y="16" width="248" height="300" rx="12" fill="url(#idBefore)"/>
    <rect x="16" y="16" width="124" height="300" rx="12" fill="url(#idBefore)"/>
    <rect x="140" y="16" width="124" height="300" rx="12" fill="url(#idAfter)"/>
    <line x1="140" y1="16" x2="140" y2="316" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
    <text x="78" y="176" text-anchor="middle" fill="#9a9080" font-family="system-ui,sans-serif" font-size="14" font-weight="700">BEFORE</text>
    <text x="202" y="176" text-anchor="middle" fill="#5a4030" font-family="system-ui,sans-serif" font-size="14" font-weight="700">AFTER</text>
    <!-- sofa silhouettes -->
    <rect x="36" y="220" width="70" height="28" rx="4" fill="#2a2520" opacity="0.6"/>
    <rect x="168" y="210" width="76" height="36" rx="6" fill="#a07850" opacity="0.55"/>
    <text x="140" y="350" text-anchor="middle" fill="#e8c9a0" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Comment PRE</text>
    <text x="140" y="374" text-anchor="middle" fill="#8a7a6a" font-family="system-ui,sans-serif" font-size="12">’ Instant DM + WhatsApp Flow</text>
    <circle cx="140" cy="400" r="6" fill="#c4784a"/>
  </g>

  <!-- Phone with chat -->
  <g transform="translate(1040,120)">
    <rect width="420" height="660" rx="42" fill="#080604" stroke="url(#idRing)" stroke-width="3"/>
    <rect x="18" y="18" width="384" height="624" rx="32" fill="url(#idPhone)"/>
    <rect x="150" y="32" width="120" height="10" rx="5" fill="#2a2218"/>
    <text x="210" y="78" text-anchor="middle" fill="#e8c9a0" font-family="system-ui,sans-serif" font-size="16" font-weight="600">Studio Atelier · AI</text>
    <text x="210" y="100" text-anchor="middle" fill="#6a5a4a" font-family="system-ui,sans-serif" font-size="11">Art. 50 · AI disclosed</text>

    <!-- bubbles -->
    <g transform="translate(40,130)">
      <rect width="260" height="56" rx="16" fill="url(#idBubbleIn)"/>
      <text x="16" y="24" fill="#d4c4b0" font-family="system-ui,sans-serif" font-size="13">How much for a kitchen like this?</text>
      <text x="16" y="44" fill="#8a7a6a" font-family="system-ui,sans-serif" font-size="11">+ 3 photos attached</text>
    </g>
    <g transform="translate(100,210)">
      <rect width="280" height="88" rx="16" fill="url(#idBubbleAi)"/>
      <text x="16" y="26" fill="#fff8f0" font-family="system-ui,sans-serif" font-size="13">I'm the studio's AI assistant.</text>
      <text x="16" y="46" fill="#ffe8d0" font-family="system-ui,sans-serif" font-size="13">Ranges only from photos  a</text>
      <text x="16" y="66" fill="#ffe8d0" font-family="system-ui,sans-serif" font-size="13">designer confirms every quote.</text>
    </g>
    <g transform="translate(40,320)">
      <rect width="300" height="120" rx="16" fill="#12100c" stroke="#c4784a" stroke-width="1.5"/>
      <text x="16" y="28" fill="#e8c9a0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">WhatsApp Flow · Project brief</text>
      <rect x="16" y="44" width="268" height="22" rx="6" fill="#1a1410"/>
      <text x="24" y="59" fill="#8a7a6a" font-family="system-ui,sans-serif" font-size="11">Room type · m² · city · budget band</text>
      <rect x="16" y="78" width="120" height="28" rx="8" fill="#c4784a"/>
      <text x="76" y="97" text-anchor="middle" fill="#fff8f0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Continue</text>
    </g>
    <g transform="translate(100,470)">
      <rect width="280" height="72" rx="16" fill="url(#idBubbleAi)"/>
      <text x="16" y="28" fill="#fff8f0" font-family="system-ui,sans-serif" font-size="13">Indicative: 1828k ¬ · kitchen</text>
      <text x="16" y="48" fill="#ffe8d0" font-family="system-ui,sans-serif" font-size="13">Book a 20-min site visit?</text>
    </g>
    <g transform="translate(40,560)">
      <rect width="200" height="40" rx="12" fill="#0e2a28" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="100" y="26" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Cal.com · confirmed</text>
    </g>
  </g>

  <!-- metric chips -->
  <g transform="translate(120,600)">
    <rect width="200" height="72" rx="14" fill="#120e0a" stroke="#3a2e24" stroke-width="1.5"/>
    <text x="24" y="32" fill="#e8c9a0" font-family="system-ui,sans-serif" font-size="22" font-weight="700">&lt;45s</text>
    <text x="24" y="54" fill="#8a7a6a" font-family="system-ui,sans-serif" font-size="12">median Reel’DM reply</text>
  </g>
  <g transform="translate(340,600)">
    <rect width="220" height="72" rx="14" fill="#120e0a" stroke="#3a2e24" stroke-width="1.5"/>
    <text x="24" y="32" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="22" font-weight="700">71%</text>
    <text x="24" y="54" fill="#8a7a6a" font-family="system-ui,sans-serif" font-size="12">billable msgs / lead</text>
  </g>
  <g transform="translate(580,600)">
    <rect width="240" height="72" rx="14" fill="#120e0a" stroke="#3a2e24" stroke-width="1.5"/>
    <text x="24" y="32" fill="#c4784a" font-family="system-ui,sans-serif" font-size="22" font-weight="700">¬2.1M</text>
    <text x="24" y="54" fill="#8a7a6a" font-family="system-ui,sans-serif" font-size="12">pipeline in 90 days</text>
  </g>
</svg>
