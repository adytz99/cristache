<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Romanian e-commerce ANPC AI Act chatbot disclosure automation case study">
  <defs>
    <linearGradient id="ecBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041018"/>
      <stop offset="50%" stop-color="#061820"/>
      <stop offset="100%" stop-color="#02080c"/>
    </linearGradient>
    <radialGradient id="ecGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ecGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ecPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1c22"/>
      <stop offset="100%" stop-color="#040c10"/>
    </linearGradient>
    <linearGradient id="ecRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ecBubbleIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2a32"/>
      <stop offset="100%" stop-color="#123840"/>
    </linearGradient>
    <linearGradient id="ecBubbleAi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="ecBadge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <pattern id="ecGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#14b8a6" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="ecBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#ecBg)"/>
  <rect width="1600" height="900" fill="url(#ecGrid)"/>
  <circle cx="1180" cy="450" r="520" fill="url(#ecGlow1)"/>
  <circle cx="420" cy="220" r="280" fill="url(#ecGlow2)"/>

  <!-- Left copy panel -->
  <g transform="translate(90,180)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="22" fill="#5eead4" letter-spacing="4" font-weight="600">CASE STUDY</text>
    <text x="0" y="70" font-family="'Segoe UI', sans-serif" font-size="48" fill="#ecfdf5" font-weight="700">ANPC + AI Act</text>
    <text x="0" y="130" font-family="'Segoe UI', sans-serif" font-size="48" fill="#ecfdf5" font-weight="700">compliant retail</text>
    <text x="0" y="190" font-family="'Segoe UI', sans-serif" font-size="48" fill="#f59e0b" font-weight="700">chatbot</text>
    <text x="0" y="260" font-family="'Segoe UI', sans-serif" font-size="20" fill="#94a3b8">Art. 50 disclosure · WhatsApp cost control</text>
    <text x="0" y="290" font-family="'Segoe UI', sans-serif" font-size="20" fill="#94a3b8">Instagram DMs · human return escalation</text>

    <g transform="translate(0,340)">
      <rect width="210" height="88" rx="16" fill="#0a1c22" stroke="#134e4a" stroke-width="2"/>
      <text x="24" y="38" font-family="'Segoe UI', sans-serif" font-size="28" fill="#5eead4" font-weight="700">71%</text>
      <text x="24" y="66" font-family="'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">Meta AI spend</text>
    </g>
    <g transform="translate(230,340)">
      <rect width="210" height="88" rx="16" fill="#0a1c22" stroke="#134e4a" stroke-width="2"/>
      <text x="24" y="38" font-family="'Segoe UI', sans-serif" font-size="28" fill="#f59e0b" font-weight="700">0</text>
      <text x="24" y="66" font-family="'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">ANPC findings</text>
    </g>
  </g>

  <!-- Phone mock -->
  <g transform="translate(1180,450)">
    <g filter="url(#ecBlur)" opacity="0.5">
      <rect x="-150" y="-260" width="300" height="520" rx="44" fill="#14b8a6" opacity="0.22"/>
    </g>
    <rect x="-160" y="-270" width="320" height="540" rx="46" fill="none" stroke="url(#ecRing)" stroke-width="6"/>
    <rect x="-150" y="-260" width="300" height="520" rx="40" fill="url(#ecPhone)"/>
    <rect x="-150" y="-260" width="300" height="520" rx="40" fill="none" stroke="#134e4a" stroke-width="2"/>

    <g transform="translate(0,-228)">
      <circle r="18" fill="#0d9488"/>
      <text x="28" y="6" font-family="'Segoe UI', sans-serif" font-size="14" fill="#99f6e4" letter-spacing="0.5">home.atelier.ro</text>
    </g>

    <!-- AI disclosure badge -->
    <g transform="translate(-120,-190)">
      <rect width="240" height="36" rx="10" fill="url(#ecBadge)"/>
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="13" fill="#111827" font-weight="700">AI disclosure · Art. 50 EU AI Act</text>
    </g>

    <g transform="translate(-130,-130)">
      <rect width="220" height="52" rx="18" fill="url(#ecBubbleIn)"/>
      <text x="16" y="22" font-family="'Segoe UI', sans-serif" font-size="13" fill="#99f6e4">Pot returna canapeaua?</text>
      <text x="16" y="40" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">Am deschis pachetul ieri.</text>
    </g>

    <g transform="translate(-90,-55)">
      <rect width="220" height="72" rx="18" fill="url(#ecBubbleAi)"/>
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#ccfbf1">Sunt un asistent AI. Returul</text>
      <text x="16" y="42" font-family="'Segoe UI', sans-serif" font-size="12" fill="#ccfbf1">14 zile e OK  te conectez</text>
      <text x="16" y="60" font-family="'Segoe UI', sans-serif" font-size="12" fill="#ccfbf1">acum cu un om din suport.</text>
    </g>

    <g transform="translate(-130,40)">
      <rect width="200" height="40" rx="14" fill="#0f2a32" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="16" y="26" font-family="'Segoe UI', sans-serif" font-size="13" fill="#fcd34d">Escalated to human</text>
    </g>

    <g transform="translate(-130,100)">
      <rect width="240" height="56" rx="14" fill="#0a1c22" stroke="#134e4a" stroke-width="1.5"/>
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#5eead4">WhatsApp Flow · 1 billable msg</text>
      <text x="16" y="44" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">vs 7 free-text service replies</text>
    </g>
  </g>
</svg>
