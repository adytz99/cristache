<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Boutique gym Instagram Reels to trial booking AI automation case study">
  <defs>
    <linearGradient id="gymBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="50%" stop-color="#0a120c"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <radialGradient id="gymGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gymGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gymPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a12"/>
      <stop offset="100%" stop-color="#060908"/>
    </linearGradient>
    <linearGradient id="gymEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gymLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="gymGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#84cc16" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="gymBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#gymBg)"/>
  <rect width="1600" height="900" fill="url(#gymGrid)"/>
  <circle cx="1180" cy="420" r="520" fill="url(#gymGlow1)"/>
  <circle cx="1180" cy="420" r="340" fill="url(#gymGlow2)"/>

  <g transform="translate(1180,420)" opacity="0.4" stroke-width="2" fill="none">
    <circle r="170" stroke="#84cc16" opacity="0.9"/>
    <circle r="230" stroke="#22d3ee" opacity="0.55"/>
    <circle r="300" stroke="#84cc16" opacity="0.4"/>
    <circle r="380" stroke="#a3e635" opacity="0.22"/>
  </g>

  <g transform="translate(1180,420)">
    <g filter="url(#gymBlur)" opacity="0.55">
      <rect x="-150" y="-205" width="300" height="410" rx="16" fill="#84cc16" opacity="0.22"/>
    </g>
    <rect x="-160" y="-215" width="320" height="430" rx="18" fill="none" stroke="url(#gymEdge)" stroke-width="6"/>
    <rect x="-150" y="-205" width="300" height="410" rx="14" fill="url(#gymPanel)"/>
    <rect x="-150" y="-205" width="300" height="410" rx="14" fill="none" stroke="#0f1a12" stroke-width="2"/>

    <g transform="translate(-128,-176)" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#bef264">
      <text x="0" y="0" font-size="11" fill="#22d3ee" letter-spacing="3">REELS ’ TRIAL · GYM</text>
      <text x="0" y="28">LEAD  @ana.runs · IG DM</text>
      <text x="0" y="52">SOURCE  REEL · 22:41</text>
      <text x="0" y="76">GOAL  FOR · 3×/SPT</text>
      <text x="0" y="100">SLOT  HIIT · MAR 19:00</text>
      <text x="0" y="124">WAIVER  DIGIT · SENT</text>
      <text x="0" y="148">DEPOSIT  49 RON · PAID</text>

      <line x1="0" y1="168" x2="244" y2="168" stroke="#84cc16" stroke-opacity="0.4"/>

      <text x="0" y="194" fill="#22d3ee">META AGENT · COST-GATED</text>
      <text x="0" y="218" fill="#22d3ee">GLOFOX · BOOKED </text>
      <text x="0" y="242" fill="#bef264">NO-SHOW RISK · LOW</text>

      <line x1="0" y1="262" x2="244" y2="262" stroke="#84cc16" stroke-opacity="0.4"/>

      <text x="0" y="288" fill="#d9f99d">AI · 9.2K DM / LUN</text>
      <text x="0" y="312" font-size="11" fill="#22d3ee" letter-spacing="3">TRIAL LOCKED </text>
    </g>
  </g>

  <g transform="translate(90,160)" font-family="'Segoe UI', system-ui, sans-serif">
    <text x="0" y="0" font-size="18" fill="#84cc16" letter-spacing="4" font-weight="600">CASE STUDY</text>
    <text x="0" y="72" font-size="52" fill="#f8fafc" font-weight="700">Boutique gym</text>
    <text x="0" y="132" font-size="52" fill="#f8fafc" font-weight="700">Instagram trials</text>
    <text x="0" y="200" font-size="24" fill="#94a3b8">Reels ’ DM ’ booked class in under 60s</text>

    <rect x="0" y="250" width="420" height="2" fill="url(#gymLine)"/>

    <g transform="translate(0,300)">
      <text x="0" y="0" font-size="44" fill="#84cc16" font-weight="700">3.1×</text>
      <text x="0" y="36" font-size="18" fill="#94a3b8">trial bookings from Reels</text>
    </g>
    <g transform="translate(280,300)">
      <text x="0" y="0" font-size="44" fill="#22d3ee" font-weight="700">58%</text>
      <text x="0" y="36" font-size="18" fill="#94a3b8">no-show rate on trials</text>
    </g>
    <g transform="translate(0,420)">
      <text x="0" y="0" font-size="44" fill="#a3e635" font-weight="700">71%</text>
      <text x="0" y="36" font-size="18" fill="#94a3b8">Meta AI token spend vs native agent</text>
    </g>
  </g>
</svg>
