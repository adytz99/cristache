  <circle cx="1180" cy="450" r="520" fill="url(#hlGlow1)"/>
  <circle cx="1180" cy="450" r="380" fill="url(#hlGlow2)"/>
  <circle cx="1180" cy="450" r="240" fill="url(#hlGlow3)"/>

  <g transform="translate(1180,450)" opacity="0.45" stroke-width="2" fill="none">
