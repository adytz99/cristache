      <text x="20" y="26" font-family="'Segoe UI', sans-serif" font-size="12" fill="#d0d0d0">DM de pe X · acelai flux</text>
    </g>

    <g transform="translate(30,50)">
      <rect width="200" height="50" rx="22" fill="url(#hlBubbleAi)"/>
      <text x="18" y="30" font-family="'Segoe UI', sans-serif" font-size="12" fill="#ffffff">Comand #4821 urmrit</text>
    </g>

    <g transform="translate(-130,120)">
