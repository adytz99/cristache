    <text x="-250" y="-70" font-family="'Segoe UI', sans-serif" font-size="13" fill="#95bf47" letter-spacing="2">UNIFIED OPS LAYER</text>
    <text x="-250" y="-35" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#ffffff">7 tools ’ 1 agent</text>
    <text x="-250" y="5" font-family="'Segoe UI', sans-serif" font-size="16" fill="#a0a8b0">Instagram · X · Shopify · e-Factura</text>

    <g transform="translate(-250,40)">
