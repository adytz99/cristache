<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Home lifestyle brand Instagram X Shopify unified AI automation case study">
  <defs>
    <linearGradient id="hlBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030508"/>
      <stop offset="55%" stop-color="#0a0610"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>
    <radialGradient id="hlGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5fb3" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#ff5fb3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hlGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#95bf47" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#95bf47" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hlGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hlPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120a14"/>
      <stop offset="100%" stop-color="#060308"/>
    </linearGradient>
    <linearGradient id="hlRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5fb3"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#95bf47"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="hlBubbleIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0a18"/>
      <stop offset="100%" stop-color="#241020"/>
    </linearGradient>
    <linearGradient id="hlBubbleAi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#95bf47"/>
      <stop offset="100%" stop-color="#5a8f2a"/>
    </linearGradient>
    <linearGradient id="hlLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#ff5fb3"/>
      <stop offset="100%" stop-color="#95bf47"/>
    </linearGradient>
    <pattern id="hlGrid" width="60" height="60" patternUnits="userSpaceOnUse">
