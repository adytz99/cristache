      <text x="40" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e0e0e0">X</text>
    </g>
    <g transform="translate(-10,40)">
      <rect width="100" height="36" rx="8" fill="#95bf47" fill-opacity="0.2" stroke="#95bf47" stroke-width="1"/>
      <text x="50" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#c8e6a0">Shopify</text>
    </g>
    <g transform="translate(110,40)">
      <rect width="110" height="36" rx="8" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1"/>
      <text x="55" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#9af0ff">e-Factura</text>
    </g>
  </g>

  <path d="M 700 450 H 980" stroke="url(#hlLine)" stroke-width="3" fill="none" opacity="0.7"/>
  <polygon points="980,450 968,444 968,456" fill="#95bf47"/>

  <g transform="translate(120,120)" opacity="0.85">
    <text font-family="'Segoe UI', sans-serif" font-size="14" fill="#6a7080" letter-spacing="3">CASE STUDY</text>
    <text y="50" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#ffffff">Social commerce</text>
    <text y="95" font-family="'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#95bf47">automation</text>
    <text y="140" font-family="'Segoe UI', sans-serif" font-size="18" fill="#8a9098">D2C · Instagram · X · Shopify</text>
  </g>

  <g transform="translate(120,780)">
    <text font-family="'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#95bf47">47s</text>
    <text x="0" y="28" font-family="'Segoe UI', sans-serif" font-size="14" fill="#6a7080">median DM reply · 24/7</text>
  </g>
  <g transform="translate(320,780)">
    <text font-family="'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#ff5fb3">78%</text>
    <text x="0" y="28" font-family="'Segoe UI', sans-serif" font-size="14" fill="#6a7080">DMs closed without staff</text>
