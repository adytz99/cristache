      <circle cx="115" cy="0" r="3" fill="#9af0ff"/>
      <circle cx="123" cy="0" r="3" fill="#9af0ff"/>
      <circle cx="131" cy="0" r="3" fill="#9af0ff"/>
    </g>

    <g transform="translate(-130,-160)">
      <rect width="210" height="46" rx="22" fill="url(#hlBubbleIn)"/>
      <text x="20" y="29" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f7c8e6">Pre set canapea? =Ë</text>
    </g>

    <g transform="translate(30,-90)">
      <rect width="220" height="62" rx="22" fill="url(#hlBubbleAi)"/>
      <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="12" fill="#ffffff">2.490 lei · livrare 48h</text>
      <text x="18" y="46" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e8f5d6" opacity="0.9">Link checkout trimis </text>
    </g>

    <g transform="translate(-130,-10)">
