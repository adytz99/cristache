<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Romanian pharmacy chain SIPE e-reeta AI automation case study">
  <defs>
    <linearGradient id="phBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02080c"/>
      <stop offset="55%" stop-color="#04161a"/>
      <stop offset="100%" stop-color="#02060a"/>
    </linearGradient>
    <radialGradient id="phGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.34"/>
      <stop offset="70%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="phGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2428"/>
      <stop offset="100%" stop-color="#051014"/>
    </linearGradient>
    <linearGradient id="phEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="phStream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="phLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="phGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2dd4bf" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="phBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#phBg)"/>
  <rect width="1600" height="900" fill="url(#phGrid)"/>
  <circle cx="1180" cy="420" r="520" fill="url(#phGlow1)"/>
  <circle cx="1180" cy="420" r="340" fill="url(#phGlow2)"/>

  <g transform="translate(1180,420)" opacity="0.4" stroke-width="2" fill="none">
    <circle r="170" stroke="#2dd4bf" opacity="0.9"/>
    <circle r="230" stroke="#38bdf8" opacity="0.55"/>
    <circle r="300" stroke="#2dd4bf" opacity="0.4"/>
    <circle r="380" stroke="#67e8f9" opacity="0.22"/>
  </g>

  <g transform="translate(1180,420)">
    <g filter="url(#phBlur)" opacity="0.55">
      <rect x="-150" y="-205" width="300" height="410" rx="16" fill="#2dd4bf" opacity="0.22"/>
    </g>
    <rect x="-160" y="-215" width="320" height="430" rx="18" fill="none" stroke="url(#phEdge)" stroke-width="6"/>
    <rect x="-150" y="-205" width="300" height="410" rx="14" fill="url(#phPanel)"/>
    <rect x="-150" y="-205" width="300" height="410" rx="14" fill="none" stroke="#0c2428" stroke-width="2"/>

    <g transform="translate(-128,-176)" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#a5f3fc">
      <text x="0" y="0" font-size="11" fill="#2dd4bf" letter-spacing="3">FARMACIE · SIPE</text>
      <text x="0" y="28">REET  #RO-28A1F3</text>
      <text x="0" y="52">CANAL  WHATSAPP · 08:14</text>
      <text x="0" y="76">STOC  DCI · MATCH </text>
      <text x="0" y="100">CNAS  CARD · VALID</text>
      <text x="0" y="124">PICKUP  LOC. 3 · 20 MIN</text>
      <text x="0" y="148">FARMACIST  APROB </text>

      <line x1="0" y1="168" x2="244" y2="168" stroke="#2dd4bf" stroke-opacity="0.4"/>

      <text x="0" y="194" fill="#38bdf8">e-SNTATEAMEA · SYNC</text>
      <text x="0" y="218" fill="#38bdf8">e-FACTURA B2C · QUEUED</text>
      <text x="0" y="242" fill="#a5f3fc">CNAS CLAIM · SAME DAY</text>

      <line x1="0" y1="262" x2="244" y2="262" stroke="#2dd4bf" stroke-opacity="0.4"/>

      <text x="0" y="288" fill="#ccfbf1">AI · 22.1K MSG / LUN</text>
      <text x="0" y="312" font-size="11" fill="#2dd4bf" letter-spacing="3">READY FOR PICKUP </text>
    </g>
  </g>

  <g transform="translate(120,160)" font-family="'Space Grotesk', 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="18" fill="#2dd4bf" letter-spacing="6" font-weight="600">CASE STUDY</text>
    <text x="0" y="72" font-size="54" fill="#ecfeff" font-weight="700">Pharmacy AI</text>
    <text x="0" y="138" font-size="54" fill="#ecfeff" font-weight="700">clears the queue</text>
    <text x="0" y="200" font-size="22" fill="#99f6e4" opacity="0.9">SIPE · WhatsApp · e-SntateaMea · CNAS</text>

    <rect x="0" y="250" width="420" height="2" fill="url(#phLine)"/>

    <g transform="translate(0,300)" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="16" fill="#a5f3fc">
      <text x="0" y="0">&lt;45s median DM reply</text>
      <text x="0" y="36">68% counter queue time</text>
      <text x="0" y="72">100% SIPE same-day claims</text>
      <text x="0" y="108">7 pharmacies · 0 new hires</text>
    </g>
  </g>

  <g opacity="0.85">
    <rect x="120" y="760" width="280" height="48" rx="8" fill="#0c2428" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="140" y="790" font-family="'JetBrains Mono', monospace" font-size="14" fill="#99f6e4">WhatsApp stock check </text>
    <rect x="420" y="760" width="260" height="48" rx="8" fill="#0c2428" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="440" y="790" font-family="'JetBrains Mono', monospace" font-size="14" fill="#bae6fd">SIPE reserve · pickup</text>
    <rect x="700" y="760" width="240" height="48" rx="8" fill="#0c2428" stroke="#67e8f9" stroke-opacity="0.5"/>
    <text x="720" y="790" font-family="'JetBrains Mono', monospace" font-size="14" fill="#cffafe">CNAS settlement </text>
  </g>

  <rect x="0" y="880" width="1600" height="4" fill="url(#phStream)"/>
</svg>
