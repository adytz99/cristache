    <rect x="-160" y="-215" width="320" height="430" rx="18" fill="none" stroke="url(#hvEdge)" stroke-width="6"/>
    <rect x="-150" y="-205" width="300" height="410" rx="14" fill="url(#hvPanel)"/>

    <g transform="translate(-128,-176)" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#9cdcfe">
      <text x="0" y="0" font-size="11" fill="#f97316" letter-spacing="3">LEAD · CLUJ · REEL DM</text>
      <text x="0" y="28">TIP  POMP DE CLDUR</text>
      <text x="0" y="52">SUPRAF.  142 m² · 2008</text>
      <text x="0" y="76">COMBUST.  GAZ · CENTRAL</text>
      <text x="0" y="100">POZE  4 · FLOW CAPTURED</text>
      <text x="0" y="124">SLOT  JOI 10:00 · SURVEY</text>

      <line x1="0" y1="148" x2="244" y2="148" stroke="#38bdf8" stroke-opacity="0.4"/>

      <text x="0" y="176" fill="#f97316">MSGS / BOOK  11 ’ 4.6</text>
