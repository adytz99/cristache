  <!-- Decorative heat-pump outline -->
  <g transform="translate(720,520)" opacity="0.35" fill="none" stroke="#38bdf8" stroke-width="3">
    <rect x="0" y="0" width="120" height="160" rx="8"/>
    <circle cx="60" cy="70" r="36"/>
    <circle cx="60" cy="70" r="18"/>
    <path d="M20 140 H100 M35 150 H85" stroke="#f97316"/>
