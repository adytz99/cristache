<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="TikTok Shop fashion brand AI live commerce case study">
  <defs>
    <linearGradient id="ttBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="55%" stop-color="#0a0214"/>
      <stop offset="100%" stop-color="#02060a"/>
    </linearGradient>
    <radialGradient id="ttGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fe2c55" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#fe2c55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ttGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25f4ee" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#25f4ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ttPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0410"/>
      <stop offset="100%" stop-color="#040108"/>
    </linearGradient>
    <linearGradient id="ttRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25f4ee"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fe2c55"/>
    </linearGradient>
    <linearGradient id="ttLive" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fe2c55"/>
      <stop offset="100%" stop-color="#ff5577"/>
    </linearGradient>
    <linearGradient id="ttBubbleIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0820"/>
      <stop offset="100%" stop-color="#220a30"/>
    </linearGradient>
    <linearGradient id="ttBubbleAi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fe2c55"/>
      <stop offset="100%" stop-color="#a01744"/>
    </linearGradient>
    <linearGradient id="ttCart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25f4ee"/>
      <stop offset="100%" stop-color="#0a8a86"/>
    </linearGradient>
    <linearGradient id="ttLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#fe2c55"/>
      <stop offset="100%" stop-color="#25f4ee"/>
    </linearGradient>
    <pattern id="ttGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#fe2c55" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="ttBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#ttBg)"/>
  <rect width="1600" height="900" fill="url(#ttGrid)"/>
  <circle cx="1180" cy="450" r="520" fill="url(#ttGlow1)"/>
  <circle cx="1180" cy="450" r="360" fill="url(#ttGlow2)"/>

  <g transform="translate(1180,450)" opacity="0.4" stroke-width="2" fill="none">
    <circle r="170" stroke="#fe2c55" opacity="0.85"/>
    <circle r="240" stroke="#25f4ee" opacity="0.55"/>
    <circle r="310" stroke="#ffffff" opacity="0.25"/>
    <circle r="390" stroke="#fe2c55" opacity="0.18"/>
  </g>

  <g transform="translate(1180,450)">
    <g filter="url(#ttBlur)" opacity="0.5">
      <rect x="-150" y="-260" width="300" height="520" rx="44" fill="#fe2c55" opacity="0.22"/>
    </g>
    <rect x="-160" y="-270" width="320" height="540" rx="46" fill="none" stroke="url(#ttRing)" stroke-width="6"/>
    <rect x="-150" y="-260" width="300" height="520" rx="40" fill="url(#ttPhone)"/>
    <rect x="-150" y="-260" width="300" height="520" rx="40" fill="none" stroke="#220a30" stroke-width="2"/>

    <g transform="translate(0,-230)">
      <rect x="-40" y="-14" width="80" height="28" rx="6" fill="url(#ttLive)"/>
      <circle cx="-26" cy="0" r="4" fill="#ffffff"/>
      <text x="-12" y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="2">LIVE</text>
      <text x="55" y="5" font-family="'Segoe UI', sans-serif" font-size="13" fill="#ffffff" opacity="0.85">12.4K</text>
    </g>

    <g transform="translate(-110,-180)" opacity="0.95">
      <circle r="22" fill="#1a0820" stroke="url(#ttRing)" stroke-width="2"/>
      <circle r="14" fill="#fe2c55" opacity="0.85"/>
      <text x="32" y="6" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f4d3dc" letter-spacing="1">@brand.fashion · AI co-host</text>
    </g>

    <g transform="translate(-130,-110)">
      <rect width="200" height="40" rx="20" fill="url(#ttBubbleIn)"/>
      <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f4d3dc">vreau M la rochia neagra ✨</text>
    </g>

    <g transform="translate(-30,-50)">
      <rect width="200" height="40" rx="20" fill="url(#ttBubbleAi)"/>
      <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="13" fill="#ffffff">Rezervat M · link in DM</text>
    </g>

    <g transform="translate(-130,10)">
      <rect width="170" height="40" rx="20" fill="url(#ttBubbleIn)"/>
      <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f4d3dc">mai e roz size S?</text>
    </g>

    <g transform="translate(-30,70)">
      <rect width="200" height="40" rx="20" fill="url(#ttBubbleAi)"/>
      <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="13" fill="#ffffff">3 in stoc · checkout ↘</text>
    </g>

    <g transform="translate(-130,140)">
      <rect width="220" height="44" rx="10" fill="#0a2228" stroke="url(#ttCart)" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="9" fill="none" stroke="#25f4ee" stroke-width="2"/>
      <path d="M14 22 L20 28 L32 16" stroke="#25f4ee" stroke-width="2" fill="none"/>
      <text x="46" y="27" font-family="'Segoe UI', sans-serif" font-size="13" fill="#9af0ec">Comanda · 219 RON · ramburs OK</text>
    </g>

    <g transform="translate(0,220)" opacity="0.95">
      <rect x="-115" y="-22" width="230" height="48" rx="12" fill="none" stroke="url(#ttRing)" stroke-width="2"/>
      <text x="0" y="8" text-anchor="middle" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="13" fill="#ffffff" letter-spacing="3">AI · &lt; 8s · 24/7 LIVE</text>
    </g>
  </g>

  <g transform="translate(110,200)" font-family="'Orbitron', 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="18" fill="#fe2c55" letter-spacing="6">CASE STUDY // 07</text>
    <text x="0" y="70" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="2">TIKTOK SHOP</text>
    <text x="0" y="120" font-size="32" fill="#f4d3dc" letter-spacing="3">AI LIVE-COMMERCE STACK</text>

    <g transform="translate(0,180)">
      <rect x="0" y="0" width="260" height="90" rx="6" fill="none" stroke="#fe2c55" stroke-width="2"/>
      <text x="20" y="38" font-size="16" fill="#f4d3dc" letter-spacing="3">GMV / 90 DAYS</text>
      <text x="20" y="78" font-size="42" font-weight="800" fill="#fe2c55">€1.4M</text>
    </g>

    <g transform="translate(280,180)">
      <rect x="0" y="0" width="240" height="90" rx="6" fill="none" stroke="#25f4ee" stroke-width="2"/>
      <text x="20" y="38" font-size="16" fill="#9af0ec" letter-spacing="3">COD RETURNS</text>
      <text x="20" y="78" font-size="44" font-weight="800" fill="#25f4ee">-38%</text>
    </g>

    <g transform="translate(0,310)" font-size="14" fill="#9aa3b2" letter-spacing="2">
      <text>TIKTOK SHOP API · OPENAI REALTIME · ELEVENLABS · SAMEDAY · n8n</text>
    </g>
  </g>

  <g transform="translate(140,720)" opacity="0.7">
    <polyline
      points="0,40 30,40 40,18 50,58 60,10 70,55 80,22 90,46 100,40 130,40 140,28 150,52 160,20 170,55 180,15 190,50 200,40 240,40 250,30 260,48 270,18 280,55 290,12 300,58 310,40 350,40"
      fill="none" stroke="#fe2c55" stroke-width="2"/>
    <polyline
      points="350,40 370,40 380,28 390,52 400,15 410,58 420,22 430,50 440,30 470,40 480,12 490,60 500,25 510,48 520,18 530,55 540,28 550,45 560,40 600,40"
      fill="none" stroke="#25f4ee" stroke-width="2" opacity="0.7"/>
  </g>

  <rect x="0" y="870" width="1600" height="2" fill="url(#ttLine)"/>
</svg>
